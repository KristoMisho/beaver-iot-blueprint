      - key: button_lock_settings.reset_config
        type: boolean
        entity_mapping: button_lock_settings.reset_config
      - key: button_lock_settings.switch_config
        type: boolean
        entity_mapping: button_lock_settings.switch_config
      - key: clear_power_consumption
