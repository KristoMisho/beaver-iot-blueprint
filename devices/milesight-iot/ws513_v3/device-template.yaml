      - key: temperature_alarm.alarm_type
        type: long
        entity_mapping: temperature_alarm.alarm_type
      - key: temperature_alarm.celsius_temperature
        type: double
        entity_mapping: temperature_alarm.celsius_temperature
      - key: temperature_alarm.fahrenheit_temperature
        type: double
