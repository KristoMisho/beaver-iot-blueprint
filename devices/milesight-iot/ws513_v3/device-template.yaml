      - key: daylight_saving_time.dst_bias
        type: long
        entity_mapping: daylight_saving_time.dst_bias
      - key: daylight_saving_time.enable
        type: boolean
        entity_mapping: daylight_saving_time.enable
      - key: daylight_saving_time.end_hour_min
        type: long
        entity_mapping: daylight_saving_time.end_hour_min
      - key: daylight_saving_time.end_month
        type: long
        entity_mapping: daylight_saving_time.end_month
      - key: daylight_saving_time.end_week_day
        type: long
        entity_mapping: daylight_saving_time.end_week_day
      - key: daylight_saving_time.end_week_num
        type: long
        entity_mapping: daylight_saving_time.end_week_num
      - key: daylight_saving_time.start_hour_min
        type: long
        entity_mapping: daylight_saving_time.start_hour_min
      - key: daylight_saving_time.start_month
        type: long
        entity_mapping: daylight_saving_time.start_month
      - key: daylight_saving_time.start_week_day
        type: long
        entity_mapping: daylight_saving_time.start_week_day
      - key: daylight_saving_time.start_week_num
        type: long
        entity_mapping: daylight_saving_time.start_week_num
      - key: get_schedule.schedule_id
        type: long
        entity_mapping: get_schedule.schedule_id
      - key: high_current_protection.enable
        type: boolean
        entity_mapping: high_current_protection.enable
      - key: invert_socket_status
        type: boolean
        entity_mapping: invert_socket_status
      - key: led_indicator_mode
        type: boolean
        entity_mapping: led_indicator_mode
      - key: overcurrent_alarm_settings.enable
        type: boolean
        entity_mapping: overcurrent_alarm_settings.enable
      - key: overcurrent_alarm_settings.threshold
        type: long
        entity_mapping: overcurrent_alarm_settings.threshold
      - key: overcurrent_protection.enable
        type: boolean
        entity_mapping: overcurrent_protection.enable
      - key: overcurrent_protection.threshold
        type: long
        entity_mapping: overcurrent_protection.threshold
      - key: power_consumption_enable
        type: boolean
        entity_mapping: power_consumption_enable
      - key: power_switch_mode
        type: long
        entity_mapping: power_switch_mode
      - key: query_device_status
        type: boolean
        entity_mapping: query_device_status
      - key: reboot
        type: boolean
        entity_mapping: reboot
      - key: reporting_interval_settings.time
        type: long
        entity_mapping: reporting_interval_settings.time
      - key: set_socket.status_1
        type: long
        entity_mapping: set_socket.status_1
      - key: temperature_alarm_rule.celsius_threshold_max
        type: double
        entity_mapping: temperature_alarm_rule.celsius_threshold_max
      - key: temperature_alarm_rule.celsius_threshold_min
        type: double
        entity_mapping: temperature_alarm_rule.celsius_threshold_min
      - key: temperature_alarm_rule.condition
        type: long
        entity_mapping: temperature_alarm_rule.condition
      - key: temperature_alarm_rule.fahrenheit_threshold_max
        type: double
        entity_mapping: temperature_alarm_rule.fahrenheit_threshold_max
      - key: temperature_alarm_rule.fahrenheit_threshold_min
