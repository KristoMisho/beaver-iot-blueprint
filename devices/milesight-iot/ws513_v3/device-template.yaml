        entity_mapping: voltage_collection_error_report.type
      - key: reset_event
        type: boolean
        entity_mapping: reset_event
  output:
    type: object
    properties:
      - key: alarm_settings.alarm_count
        type: double
        entity_mapping: alarm_settings.alarm_count
      - key: alarm_settings.alarm_interval
        type: double
        entity_mapping: alarm_settings.alarm_interval
      - key: alarm_settings.release_enable
        type: long
        entity_mapping: alarm_settings.release_enable
      - key: bluetooth_name
        type: string
