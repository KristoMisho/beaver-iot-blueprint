metadata:
  device_type: cellular

definition:
  input:
    type: object
    properties:
      - key: device_id
        type: string
        required: true
        is_device_id: true
      - key: sn
        type: string
        entity_mapping: sn
      # --- Info Connettività Cellular ---
      - key: imei
        type: string
        entity_mapping: imei
      - key: imsi
        type: string
        entity_mapping: imsi
      - key: iccid
        type: string
        entity_mapping: iccid
      - key: csq
        type: long
        entity_mapping: csq
      # --- Sistema & Stato ---
      - key: firmwareVersion
        type: string
        entity_mapping: firmware_version
      - key: hardwareVersion
        type: string
        entity_mapping: hardware_version
      - key: battery
        type: long
        entity_mapping: battery
      # --- GPIO Inputs & Counters ---
      - key: gpio_input_1
        type: string
        entity_mapping: gpio_input_1
      - key: gpio_input_2
        type: string
        entity_mapping: gpio_input_2
      - key: gpio_counter_1
        type: long
        entity_mapping: gpio_counter_1
      - key: gpio_counter_2
        type: long
        entity_mapping: gpio_counter_2
      # --- Analog Input 1 (Current Mode: adc_1) ---
      - key: adc_1
        type: double
        entity_mapping: adc_1
      - key: adc_1_min
        type: double
        entity_mapping: adc_1_min
      - key: adc_1_max
        type: double
        entity_mapping: adc_1_max
      - key: adc_1_avg
        type: double
        entity_mapping: adc_1_avg
      - key: adc_1_alarm
        type: string
        entity_mapping: adc_1_alarm
      # --- Analog Input 1 (Voltage Mode: adv_1) ---
      - key: adv_1
        type: double
        entity_mapping: adv_1
      - key: adv_1_min
        type: double
        entity_mapping: adv_1_min
      - key: adv_1_max
        type: double
        entity_mapping: adv_1_max
      - key: adv_1_avg
        type: double
        entity_mapping: adv_1_avg
      - key: adv_1_alarm
        type: string
        entity_mapping: adv_1_alarm
      # --- Analog Input 2 (Current Mode: adc_2) ---
      - key: adc_2
        type: double
        entity_mapping: adc_2
      - key: adc_2_min
        type: double
        entity_mapping: adc_2_min
      - key: adc_2_max
        type: double
        entity_mapping: adc_2_max
      - key: adc_2_avg
        type: double
        entity_mapping: adc_2_avg
      - key: adc_2_alarm
        type: string
        entity_mapping: adc_2_alarm
      # --- Analog Input 2 (Voltage Mode: adv_2) ---
      - key: adv_2
        type: double
        entity_mapping: adv_2
      - key: adv_2_min
        type: double
        entity_mapping: adv_2_min
      - key: adv_2_max
        type: double
        entity_mapping: adv_2_max
      - key: adv_2_avg
        type: double
        entity_mapping: adv_2_avg
      - key: adv_2_alarm
        type: string
        entity_mapping: adv_2_alarm
      # --- SDI-12 Sensor ---
      - key: sdi_chn_1
        type: string
        entity_mapping: sdi_chn_1
      # --- Modbus Channels (RS485) ---
      - key: modbus_chn_1
        type: double
        entity_mapping: modbus_chn_1
      - key: modbus_chn_2
        type: double
        entity_mapping: modbus_chn_2
      - key: modbus_chn_3
        type: double
        entity_mapping: modbus_chn_3
      - key: modbus_chn_4
        type: double
        entity_mapping: modbus_chn_4
      - key: modbus_chn_5
        type: double
        entity_mapping: modbus_chn_5
      - key: modbus_chn_6
        type: double
        entity_mapping: modbus_chn_6
      - key: modbus_chn_7
        type: double
        entity_mapping: modbus_chn_7
      - key: modbus_chn_8
        type: double
        entity_mapping: modbus_chn_8
      - key: modbus_chn_9
        type: double
        entity_mapping: modbus_chn_9
      - key: modbus_chn_10
        type: double
        entity_mapping: modbus_chn_10
      - key: modbus_chn_11
        type: double
        entity_mapping: modbus_chn_11
      - key: modbus_chn_12
        type: double
        entity_mapping: modbus_chn_12
      - key: modbus_chn_13
        type: double
        entity_mapping: modbus_chn_13
      - key: modbus_chn_14
        type: double
        entity_mapping: modbus_chn_14
      - key: modbus_chn_15
        type: double
        entity_mapping: modbus_chn_15
      - key: modbus_chn_16
        type: double
        entity_mapping: modbus_chn_16

  output:
    type: object
    properties:
      - key: gpio_output_1
        type: boolean
        entity_mapping: gpio_output_1
      - key: gpio_output_2
        type: boolean
        entity_mapping: gpio_output_2
      - key: reboot
        type: boolean
        entity_mapping: reboot

initial_entities:
  - name: Serial Number
    type: property
    access_mod: R
    value_type: string
    attributes:
      max_length: 16
    identifier: sn
  - name: IMEI
    type: property
    access_mod: R
    value_type: string
    identifier: imei
  - name: IMSI
    type: property
    access_mod: R
    value_type: string
    identifier: imsi
  - name: ICCID
    type: property
    access_mod: R
    value_type: string
    identifier: iccid
  - name: Signal Strength (CSQ)
    type: property
    access_mod: R
    value_type: long
    identifier: csq
  - name: Firmware Version
    type: property
    access_mod: R
    value_type: string
    identifier: firmware_version
  - name: Hardware Version
    type: property
    access_mod: R
    value_type: string
    identifier: hardware_version
  - name: Battery
    type: property
    access_mod: R
    value_type: long
    attributes:
      unit: '%'
    identifier: battery
  # --- GPIO ---
  - name: GPIO Input (Channel 1)
    type: property
    access_mod: R
    value_type: string
    identifier: gpio_input_1
  - name: GPIO Input (Channel 2)
    type: property
    access_mod: R
    value_type: string
    identifier: gpio_input_2
  - name: GPIO Counter (Channel 1)
    type: property
    access_mod: R
    value_type: long
    identifier: gpio_counter_1
  - name: GPIO Counter (Channel 2)
    type: property
    access_mod: R
    value_type: long
    identifier: gpio_counter_2
  - name: GPIO Output (Channel 1)
    type: property
    access_mod: RW
    value_type: boolean
    attributes:
      enum:
        'false': 'off'
        'true': 'on'
    identifier: gpio_output_1
  - name: GPIO Output (Channel 2)
    type: property
    access_mod: RW
    value_type: boolean
    attributes:
      enum:
        'false': 'off'
        'true': 'on'
    identifier: gpio_output_2
  # --- Analog Input Channel 1 ---
  - name: Analog Input Current (Channel 1)
    type: property
    access_mod: R
    value_type: double
    identifier: adc_1
  - name: Analog Input Voltage (Channel 1)
    type: property
    access_mod: R
    value_type: double
    identifier: adv_1
  - name: Analog Input Alarm (Channel 1)
    type: property
    access_mod: R
    value_type: string
    identifier: adc_1_alarm
  # --- Analog Input Channel 2 ---
  - name: Analog Input Current (Channel 2)
    type: property
    access_mod: R
    value_type: double
    identifier: adc_2
  - name: Analog Input Voltage (Channel 2)
    type: property
    access_mod: R
    value_type: double
    identifier: adv_2
  - name: Analog Input Alarm (Channel 2)
    type: property
    access_mod: R
    value_type: string
    identifier: adc_2_alarm
  # --- SDI-12 & Modbus ---
  - name: SDI-12 Channel 1
    type: property
    access_mod: R
    value_type: string
    identifier: sdi_chn_1
  - name: Modbus Channel 1
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_1
  - name: Modbus Channel 2
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_2
  - name: Modbus Channel 3
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_3
  - name: Modbus Channel 4
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_4
  - name: Modbus Channel 5
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_5
  - name: Modbus Channel 6
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_6
  - name: Modbus Channel 7
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_7
  - name: Modbus Channel 8
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_8
  - name: Modbus Channel 9
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_9
  - name: Modbus Channel 10
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_10
  - name: Modbus Channel 11
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_11
  - name: Modbus Channel 12
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_12
  - name: Modbus Channel 13
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_13
  - name: Modbus Channel 14
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_14
  - name: Modbus Channel 15
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_15
  - name: Modbus Channel 16
    type: property
    access_mod: RW
    value_type: double
    identifier: modbus_chn_16
  - name: Reboot
    type: service
    access_mod: W
    value_type: boolean
    attributes:
      enum:
        'false': 'no'
        'true': 'yes'
    identifier: reboot

codec:
  id: default
  ref: uc501/codec/device-codec.yaml
